server:
  port: 8082

services:
  tecnologias:
    base-url: http://localhost:8081

spring:
  application:
    name: capacidad-service
  r2dbc:
    url: r2dbc:mysql://localhost:3306/capacidades_db
    username: root
    password: root
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
